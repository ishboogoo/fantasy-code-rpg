name: CI
on: [push, pull_request]
# Test runs can read the code and nothing else; only the release workflow may write.
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "${{ matrix.node }}" }
      - run: npm ci || npm install
      - run: npm run typecheck
      - run: npm test
      - run: node src/cli.ts demo --battles 20
      # The published package: build, pack, install it somewhere clean and play a demo from it.
      - run: npm pack
      - run: |
          mkdir -p /tmp/pkgtest && cd /tmp/pkgtest && npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/fantasy-code-rpg-*.tgz
          npx fcrpg demo --battles 5
