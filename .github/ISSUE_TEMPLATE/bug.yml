name: "👺 Goblin sighting (bug)"
description: Something is broken
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, and what did you expect? }
    validations: { required: true }
  - type: textarea
    id: repro
    attributes: { label: Steps to reproduce, render: shell }
    validations: { required: true }
  - type: input
    id: env
    attributes: { label: "Node version, OS, adapter and CLI version (e.g. claude --version)" }
  - type: checkboxes
    id: security
    attributes:
      label: Security
      options:
        - label: This is NOT a tier bypass or self-grading exploit (those go to a private security advisory — see SECURITY.md)
          required: true
